[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-lib"
version = "0.1.0"
description = "Deterministic, model-agnostic LLM benchmark library"
requires-python = ">=3.10"
dependencies = [
  "groq>=1.1.1",
  "google-genai>=1.0.0",
  "requests>=2.31.0",
]

[project.optional-dependencies]
datasets = [
  "datasets>=2.18.0",
  "pyarrow>=14.0.0",
]
openai = [
  "openai>=1.30.0",
]
groq = [
  "groq>=0.9.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark_lib*"]
